appId: net.learnimo.app
---
# Profile editing E2E flows
# Covers: edit display name, edit bio, change avatar, remove avatar

# ── Shared login helper ─────────────────────────────────────────────────────
# Each flow restarts the app cleanly and logs in before exercising the feature.

# ── Flow 1: Edit display name ───────────────────────────────────────────────
- launchApp:
    clearState: true
- assertVisible: "Welcome back"
- tapOn:
    text: "Email"
- inputText: "test@learnimo.net"
- tapOn:
    text: "Password"
- inputText: "TestPass123"
- tapOn:
    text: "Sign in"
- assertVisible: "My Learnings"
# Navigate to Profile tab
- tapOn:
    text: "Profile"
- assertVisible: "Profile"
# Tap the display name field and update it
- tapOn:
    id: "display-name-input"
- clearText
- inputText: "Alice Smith"
# Tap Save for display name
- tapOn:
    id: "display-name-save"
# Assert updated display name appears in the profile card
- assertVisible: "Alice Smith"

# ── Flow 2: Edit bio ────────────────────────────────────────────────────────
- launchApp:
    clearState: true
- assertVisible: "Welcome back"
- tapOn:
    text: "Email"
- inputText: "test@learnimo.net"
- tapOn:
    text: "Password"
- inputText: "TestPass123"
- tapOn:
    text: "Sign in"
- assertVisible: "My Learnings"
- tapOn:
    text: "Profile"
- assertVisible: "Profile"
# Tap the bio field and update it
- tapOn:
    id: "bio-input"
- clearText
- inputText: "I love learning!"
# Assert char counter updates
- assertVisible: "17/200"
# Tap Save for bio
- tapOn:
    id: "bio-save"
# Assert updated bio is visible
- assertVisible: "I love learning!"

# ── Flow 3: Change avatar ───────────────────────────────────────────────────
- launchApp:
    clearState: true
- assertVisible: "Welcome back"
- tapOn:
    text: "Email"
- inputText: "test@learnimo.net"
- tapOn:
    text: "Password"
- inputText: "TestPass123"
- tapOn:
    text: "Sign in"
- assertVisible: "My Learnings"
- tapOn:
    text: "Profile"
- assertVisible: "Profile"
# Tap the avatar area to open image picker
- tapOn:
    id: "avatar-picker"
# Select image from system media library (Maestro picks the first available image)
- assertVisible: "Change photo"
- tapOn:
    text: "Change photo"
# After picker selection and upload, avatar image should appear
# (The photo picker OS dialog opens — Maestro handles native pickers automatically)

# ── Flow 4: Remove avatar ───────────────────────────────────────────────────
- launchApp:
    clearState: true
- assertVisible: "Welcome back"
- tapOn:
    text: "Email"
- inputText: "test@learnimo.net"
- tapOn:
    text: "Password"
- inputText: "TestPass123"
- tapOn:
    text: "Sign in"
- assertVisible: "My Learnings"
- tapOn:
    text: "Profile"
- assertVisible: "Profile"
# Tap "Remove photo" (only visible when user has an avatar)
- tapOn:
    text: "Remove photo"
# Confirm in the dialog
- tapOn:
    text: "Remove"
# Assert initials placeholder is shown (avatar image no longer visible)
- assertNotVisible:
    id: "avatar-image"
